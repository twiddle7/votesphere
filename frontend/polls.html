<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Explore Polls · VoteSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="polls">

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="page">

        <section class="section">
          <div class="section-head">
            <h2>Explore Polls</h2>
            <a class="btn btn-primary btn-sm" href="create-poll.html">
              <i data-lucide="plus"></i> New Poll
            </a>
          </div>

          <div class="card" style="padding:16px;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;">
            <input id="searchInput" type="text" placeholder="Search polls…"
              style="flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-family:inherit;" />
            <select id="statusFilter"
              style="padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-family:inherit;">
              <option value="all">All statuses</option>
              <option value="active">Active</option>
              <option value="closed">Closed</option>
            </select>
          </div>

          <div class="card-grid" id="pollsGrid">
            <div class="poll-card skeleton-card"></div>
            <div class="poll-card skeleton-card"></div>
            <div class="poll-card skeleton-card"></div>
          </div>
        </section>

      </main>

      <footer class="footer">
        <span>VoteSphere · Academic Cloud Computing Project</span>
        <span class="dot">•</span>
        <a href="about.html">Architecture</a>
      </footer>
    </div>
  </div>

  <div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.417.0/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/websocket.js"></script>
  <script src="js/app.js"></script>
  <script src="js/polls.js"></script>
</body>
</html>
