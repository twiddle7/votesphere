<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Results · VoteSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="results">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-scrim" id="sidebarScrim"></div>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="page">
        <section class="section">
          <div class="section-head">
            <h2 id="pollQuestion">Live Results</h2>
            <span id="connBadge" class="pill pill-warning">
              <i data-lucide="wifi-off"></i> Connecting…
            </span>
          </div>

          <div class="card" style="padding:24px;margin-bottom:20px;">
            <div id="voteSection">
              <h3 style="margin-top:0;font-size:16px;">Cast your vote</h3>
              <div id="voteOptions" style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;"></div>
              <button class="btn btn-primary" id="voteBtn">
                <i data-lucide="vote"></i> Submit Vote
              </button>
            </div>
          </div>

          <div class="card" style="padding:24px;">
            <h3 style="margin-top:0;font-size:16px;">Results</h3>
            <div style="position:relative;height:300px;margin-bottom:24px;">
              <canvas id="resultsChart"></canvas>
            </div>
            <div id="resultsList" style="display:flex;flex-direction:column;gap:12px;"></div>
          </div>
        </section>
      </main>
      <footer class="footer">
        <span>VoteSphere · Academic Cloud Computing Project</span>
      </footer>
    </div>
  </div>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.417.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/websocket.js"></script>
  <script src="js/app.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
